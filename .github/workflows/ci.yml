name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-plugin:
    name: Build & Test Plugin (ELAN ${{ matrix.elan_version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elan_version: "6.6"
            elan_major: "6"
            java_version: "17"
            download_url: "https://www.mpi.nl/tools/elan/ELAN_6-6_linux.tar.gz"
          - elan_version: "7.1"
            elan_major: "7"
            java_version: "21"
            download_url: "https://www.mpi.nl/tools/elan/ELAN_7-1_linux.tar.gz"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java_version }}
          cache: 'maven'

      - name: Cache ELAN ${{ matrix.elan_version }} Reference JAR
        id: cache-elan
        uses: actions/cache@v4
        with:
          path: elan-plugin/lib/elan.jar
          key: elan-jar-${{ matrix.elan_version }}-v2

      - name: Fetch ELAN ${{ matrix.elan_version }} reference JAR
        if: steps.cache-elan.outputs.cache-hit != 'true' || hashFiles('elan-plugin/lib/elan.jar') == ''
        run: |
          mkdir -p elan-plugin/lib /tmp/elan-dist
          curl -fsSL --retry 3 --retry-delay 2 "${{ matrix.download_url }}" -o /tmp/elan_linux.tar.gz
          tar -xzf /tmp/elan_linux.tar.gz -C /tmp/elan-dist
          FOUND_JAR="$(find /tmp/elan-dist -iname "elan*.jar" ! -iname "*plugin*" ! -iname "*ext*" | head -n 1)"
          if [ -n "$FOUND_JAR" ] && [ -f "$FOUND_JAR" ]; then
            cp "$FOUND_JAR" elan-plugin/lib/elan.jar
            echo "Successfully installed ELAN reference JAR: $FOUND_JAR"
          else
            echo "Failed to locate elan.jar in distribution"
            exit 1
          fi

      - name: Build & Run Tests with Maven
        run: |
          cd elan-plugin
          mvn clean test

      - name: Package Plugin JAR & Extension Zip
        run: |
          mkdir -p dist
          cd elan-plugin
          mvn package -DskipTests
          BUILT_JAR="$(find target-out -name "cherokee-aligner-plugin-*.jar" ! -name "original-*" | head -n 1)"
          if [ -z "$BUILT_JAR" ] || [ ! -f "$BUILT_JAR" ]; then
            echo "Error: Output JAR was not found at target-out"
            exit 1
          fi
          
          # Stage zip contents: jar + cherokee-aligner.cmdi + recognizer.cmdi
          STAGING_DIR="/tmp/elan-staging-${{ matrix.elan_major }}"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"
          cp "$BUILT_JAR" "$STAGING_DIR/cherokee-aligner-plugin-elan${{ matrix.elan_major }}-1.0.0-SNAPSHOT.jar"
          cp src/main/resources/cherokee-aligner.cmdi "$STAGING_DIR/"
          cp src/main/resources/recognizer.cmdi "$STAGING_DIR/"
          
          ZIP_NAME="cherokee-aligner-elan-${{ matrix.elan_major }}.zip"
          (cd "$STAGING_DIR" && zip -r "../../dist/${ZIP_NAME}" .)
          rm -rf "$STAGING_DIR"
          
          echo "Verifying contents of dist/${ZIP_NAME}:"
          unzip -l "../dist/${ZIP_NAME}"

      - name: Upload Plugin Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip-elan-${{ matrix.elan_major }}
          path: dist/cherokee-aligner-elan-${{ matrix.elan_major }}.zip
          retention-days: 1

  test-backend:
    name: Test Python Backend (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          cd backend
          docker build -t cherokee-aligner:test .

      - name: Run Backend Tests in Container
        run: |
          docker run --rm cherokee-aligner:test pytest tests