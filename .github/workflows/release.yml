name: Release Plugin & Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release-plugin:
    name: Build & Release ELAN Plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Plugin for ELAN 6.6
        run: |
          mkdir -p elan-plugin/lib /tmp/elan-dist-6 dist
          curl -fsSL --retry 3 --retry-delay 2 "https://www.mpi.nl/tools/elan/ELAN_6-6_linux.tar.gz" -o /tmp/elan_6_6.tar.gz
          tar -xzf /tmp/elan_6_6.tar.gz -C /tmp/elan-dist-6
          FOUND_JAR="$(find /tmp/elan-dist-6 -iname "elan*.jar" ! -iname "*plugin*" ! -iname "*ext*" | head -n 1)"
          cp "$FOUND_JAR" elan-plugin/lib/elan.jar
          (cd elan-plugin && mvn clean package -DskipTests)
          cp elan-plugin/target-out/cherokee-aligner-plugin-1.0.0-SNAPSHOT.jar dist/cherokee-aligner-plugin-elan6-1.0.0-SNAPSHOT.jar
          cp elan-plugin/target-out/cherokee-aligner-plugin-1.0.0-SNAPSHOT.jar dist/cherokee-aligner-plugin-1.0.0-SNAPSHOT.jar

      - name: Build Plugin for ELAN 7.1
        run: |
          rm -f elan-plugin/lib/elan.jar
          mkdir -p /tmp/elan-dist-7 dist
          curl -fsSL --retry 3 --retry-delay 2 "https://www.mpi.nl/tools/elan/ELAN_7-1_linux.tar.gz" -o /tmp/elan_7_1.tar.gz
          tar -xzf /tmp/elan_7_1.tar.gz -C /tmp/elan-dist-7
          FOUND_JAR="$(find /tmp/elan-dist-7 -iname "elan*.jar" ! -iname "*plugin*" ! -iname "*ext*" | head -n 1)"
          cp "$FOUND_JAR" elan-plugin/lib/elan.jar
          (cd elan-plugin && mvn clean package -DskipTests)
          cp elan-plugin/target-out/cherokee-aligner-plugin-1.0.0-SNAPSHOT.jar dist/cherokee-aligner-plugin-elan7-1.0.0-SNAPSHOT.jar

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cherokee-aligner-plugin-elan6-1.0.0-SNAPSHOT.jar
            dist/cherokee-aligner-plugin-elan7-1.0.0-SNAPSHOT.jar
            dist/cherokee-aligner-plugin-1.0.0-SNAPSHOT.jar
            elan-plugin/src/main/resources/cherokee-aligner.cmdi
            elan-plugin/src/main/resources/recognizer.cmdi
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push-docker:
    name: Build & Publish Docker Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cherokee-aligner-backend
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
