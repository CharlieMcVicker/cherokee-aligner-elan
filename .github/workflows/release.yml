name: Release Plugin & Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-test-publish-backend:
    name: Build, Test & Publish Docker Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cherokee-aligner-backend
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build Docker image for Testing
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: cherokee-aligner:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Backend Tests in Built Image
        run: |
          docker run --rm cherokee-aligner:test pytest tests

      - name: Push Tested Docker Image to GHCR
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Tagging and pushing $tag..."
            docker tag cherokee-aligner:test "$tag"
            docker push "$tag"
          done <<< "$TAGS"

  build-plugin:
    name: Build Plugin (ELAN ${{ matrix.elan_version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elan_version: "6.6"
            elan_tag: "elan6"
            elan_major: "6"
            java_version: "17"
            download_url: "https://www.mpi.nl/tools/elan/ELAN_6-6_linux.tar.gz"
            is_default: true
          - elan_version: "7.1"
            elan_tag: "elan7"
            elan_major: "7"
            java_version: "21"
            download_url: "https://www.mpi.nl/tools/elan/ELAN_7-1_linux.tar.gz"
            is_default: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java_version }}
          cache: 'maven'

      - name: Cache ELAN ${{ matrix.elan_version }} Reference JAR
        id: cache-elan
        uses: actions/cache@v4
        with:
          path: elan-plugin/lib/elan.jar
          key: elan-jar-${{ matrix.elan_version }}-v2

      - name: Fetch ELAN ${{ matrix.elan_version }} reference JAR
        if: steps.cache-elan.outputs.cache-hit != 'true' || hashFiles('elan-plugin/lib/elan.jar') == ''
        run: |
          mkdir -p elan-plugin/lib /tmp/elan-dist
          curl -fsSL --retry 3 --retry-delay 2 "${{ matrix.download_url }}" -o /tmp/elan_linux.tar.gz
          tar -xzf /tmp/elan_linux.tar.gz -C /tmp/elan-dist
          FOUND_JAR="$(find /tmp/elan-dist -iname "elan*.jar" ! -iname "*plugin*" ! -iname "*ext*" | head -n 1)"
          if [ -n "$FOUND_JAR" ] && [ -f "$FOUND_JAR" ]; then
            cp "$FOUND_JAR" elan-plugin/lib/elan.jar
            echo "Successfully installed ELAN reference JAR: $FOUND_JAR"
          else
            echo "Failed to locate elan.jar in distribution"
            exit 1
          fi

      - name: Run Tests with Maven
        run: |
          cd elan-plugin
          mvn clean test

      - name: Package Plugin Zip with Dynamic Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="1.0.0"
          fi
          echo "Packaging plugin version $VERSION for ELAN ${{ matrix.elan_version }}"
          DIST_DIR="${GITHUB_WORKSPACE:-$(pwd)}/dist"
          mkdir -p "$DIST_DIR"
          cd elan-plugin
          mvn clean package -DskipTests
          BUILT_JAR="$(find target-out -name "cherokee-aligner-plugin-*.jar" ! -name "original-*" | head -n 1)"
          if [ -z "$BUILT_JAR" ] || [ ! -f "$BUILT_JAR" ]; then
            echo "Error: Built JAR not found in target-out"
            exit 1
          fi
          
          # Stage zip contents: jar + cherokee-aligner.cmdi + recognizer.cmdi
          STAGING_DIR="/tmp/elan-release-staging-${{ matrix.elan_major }}"
          rm -rf "$STAGING_DIR"
          mkdir -p "$STAGING_DIR"
          
          JAR_TARGET_NAME="cherokee-aligner-plugin-${{ matrix.elan_tag }}-${VERSION}.jar"
          cp "$BUILT_JAR" "$STAGING_DIR/${JAR_TARGET_NAME}"
          cp src/main/resources/cherokee-aligner.cmdi "$STAGING_DIR/"
          cp src/main/resources/recognizer.cmdi "$STAGING_DIR/"
          
          ZIP_NAME="cherokee-aligner-elan-${{ matrix.elan_major }}.zip"
          (cd "$STAGING_DIR" && zip -r "${DIST_DIR}/${ZIP_NAME}" .)
          rm -rf "$STAGING_DIR"
          
          echo "Verifying contents of dist/${ZIP_NAME}:"
          unzip -l "${DIST_DIR}/${ZIP_NAME}"

      - name: Upload Plugin Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-zip-elan-${{ matrix.elan_major }}
          path: dist/cherokee-aligner-elan-${{ matrix.elan_major }}.zip
          retention-days: 1

  release-github:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-plugin, build-test-publish-backend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Plugin Zip Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/cherokee-aligner-elan-6.zip
            dist/cherokee-aligner-elan-7.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
